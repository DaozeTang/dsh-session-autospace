  <rect x="664" y="1242" width="472" height="44" rx="10" fill="#F1F3F9" stroke="#E3E6EE"/>
  <rect x="668" y="1246" width="76" height="36" rx="8" fill="#FFFFFF"/>
  <text x="706" y="1270" fill="#1E2637" font-size="16" text-anchor="middle" font-weight="600">All</text>
