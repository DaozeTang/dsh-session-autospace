  <rect width="1600" height="1960" fill="url(#bg)"/>

  <!-- app chrome -->
  <rect width="1600" height="92" fill="#FFFFFF"/>
  <path d="M0 92h1600" stroke="#EEF0F4" stroke-width="2"/>
  <path d="m48 46 8-8M48 46l8 8" stroke="#6A7181" stroke-width="2.2" stroke-linecap="round"/>
  <text x="76" y="53" fill="#6A7181" font-size="19">Settings</text>
  <text x="164" y="53" fill="#B0B6C2" font-size="19">/</text>
  <text x="184" y="53" fill="#1C1D21" font-size="19" font-weight="600">Session autospace</text>
  <text x="1528" y="53" fill="#8A92A6" font-size="18" text-anchor="end">DSH Desktop</text>

  <!-- plugin header -->
  <rect x="220" y="132" width="56" height="56" rx="14" fill="#EDF0FF"/>
  <g color="#4D6BFE"><use href="#i-autospace" x="234" y="146" width="28" height="28"/></g>
  <text x="296" y="158" fill="#171A21" font-size="34" font-weight="700" letter-spacing="-.4">Session autospace</text>
  <rect x="624" y="134" width="64" height="28" rx="14" fill="#F1F3F9"/>
  <text x="656" y="153" fill="#7B8291" font-size="15" text-anchor="middle" font-weight="600">0.4.0</text>
  <text x="296" y="192" fill="#6A7181" font-size="19">Give every conversation its own folder — even when you don’t pick a workspace.</text>

  <!-- card: working path -->
  <rect x="220" y="228" width="1160" height="286" rx="18" fill="#FFFFFF" stroke="#E8EAF0" filter="url(#card)"/>
  <text x="256" y="282" fill="#171A21" font-size="28" font-weight="650">Working path</text>
  <rect x="1238" y="258" width="106" height="30" rx="15" fill="#F1F3F9"/>
  <text x="1291" y="278" fill="#7B8291" font-size="15" text-anchor="middle" font-weight="600">Default</text>
  <text x="256" y="316" fill="#7B8291" font-size="18">Each conversation gets a folder named after its session; that folder is its working directory and sandbox boundary.</text>
  <text x="256" y="358" fill="#8A92A6" font-size="16">In use</text>
  <rect x="256" y="374" width="972" height="56" rx="10" fill="#FBFCFE" stroke="#DDE1EA" stroke-width="1.5"/>
  <text x="278" y="409" fill="#1E2637" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/DSH</text>
  <text x="352" y="409" fill="#A0A7B5" font-size="18">(default)</text>
  <rect x="256" y="444" width="118" height="38" rx="8" fill="#FFFFFF" stroke="#DDE1EA"/>
  <text x="315" y="469" fill="#2A3040" font-size="17" text-anchor="middle">Choose…</text>
  <rect x="388" y="444" width="188" height="38" rx="8" fill="#FFFFFF" stroke="#DDE1EA"/>
  <g color="#6A7181"><use href="#i-folder" x="404" y="452" width="20" height="20"/></g>
  <text x="432" y="469" fill="#2A3040" font-size="17">Show in Finder</text>
  <rect x="590" y="444" width="168" height="38" rx="8" fill="#FFFFFF" stroke="#DDE1EA"/>
  <text x="674" y="469" fill="#2A3040" font-size="17" text-anchor="middle">Restore default</text>
  <rect x="1252" y="383" width="92" height="38" rx="8" fill="#EDF0FF" stroke="#C9D2FF"/>
  <text x="1298" y="408" fill="#4D6BFE" font-size="17" text-anchor="middle" font-weight="600">Save</text>
  <text x="256" y="504" fill="#9AA1B0" font-size="16">Created on first use. A project’s AGENTS.md is inherited if this path sits inside that project.</text>

  <!-- card: features -->
  <rect x="220" y="538" width="1160" height="578" rx="18" fill="#FFFFFF" stroke="#E8EAF0" filter="url(#card)"/>
  <text x="256" y="592" fill="#171A21" font-size="28" font-weight="650">Features</text>
  <text x="1212" y="592" fill="#9AA1B0" font-size="17" text-anchor="end">Each switch takes effect immediately.</text>

  <text x="256" y="640" fill="#1E2637" font-size="21">Workspace menu entry</text>
  <text x="256" y="666" fill="#8A92A6" font-size="17">Adds “No workspace” to the workspace menu. Turned off, the DSH menu comes back unchanged.</text>
  <rect x="1240" y="624" width="52" height="28" rx="14" fill="#4D6BFE"/>
  <circle cx="1278" cy="638" r="10" fill="#FFFFFF"/>

  <path d="M256 686h1088" stroke="#EEF0F4" stroke-width="1.5"/>
  <text x="256" y="712" fill="#1E2637" font-size="21">Remember the last choice</text>
  <text x="256" y="738" fill="#8A92A6" font-size="17">After “No workspace”, New Session keeps opening scratch conversations until you pick a real workspace.</text>
  <rect x="1240" y="696" width="52" height="28" rx="14" fill="#4D6BFE"/>
  <circle cx="1278" cy="710" r="10" fill="#FFFFFF"/>

  <path d="M256 758h1088" stroke="#EEF0F4" stroke-width="1.5"/>
  <text x="256" y="784" fill="#1E2637" font-size="21">Conversation manager</text>
  <text x="256" y="810" fill="#8A92A6" font-size="17">Shows the scratch-conversation manager on this page.</text>
  <rect x="1240" y="768" width="52" height="28" rx="14" fill="#4D6BFE"/>
  <circle cx="1278" cy="782" r="10" fill="#FFFFFF"/>

  <path d="M256 830h1088" stroke="#EEF0F4" stroke-width="1.5"/>
  <text x="256" y="856" fill="#1E2637" font-size="21">Move folders to the Trash</text>
  <text x="256" y="882" fill="#8A92A6" font-size="17">Deleting or abandoning a conversation moves its empty folder to the system Trash.</text>
  <rect x="1240" y="840" width="52" height="28" rx="14" fill="#4D6BFE"/>
  <circle cx="1278" cy="854" r="10" fill="#FFFFFF"/>

  <path d="M256 902h1088" stroke="#EEF0F4" stroke-width="1.5"/>
  <text x="256" y="928" fill="#1E2637" font-size="21">Reuse an untouched conversation</text>
  <text x="256" y="954" fill="#8A92A6" font-size="17">Picking “No workspace” again reopens the blank scratch conversation instead of creating another folder.</text>
  <rect x="1240" y="912" width="52" height="28" rx="14" fill="#4D6BFE"/>
  <circle cx="1278" cy="926" r="10" fill="#FFFFFF"/>

  <path d="M256 974h1088" stroke="#EEF0F4" stroke-width="1.5"/>
  <text x="256" y="1000" fill="#1E2637" font-size="21">Discard on switching away</text>
  <text x="256" y="1026" fill="#8A92A6" font-size="17">Leaving a blank scratch conversation archives it and cleans up its folder.</text>
  <rect x="1240" y="984" width="52" height="28" rx="14" fill="#4D6BFE"/>
  <circle cx="1278" cy="998" r="10" fill="#FFFFFF"/>

  <path d="M256 1046h1088" stroke="#EEF0F4" stroke-width="1.5"/>
  <text x="256" y="1072" fill="#1E2637" font-size="21">Reclaim untouched conversations</text>
  <text x="256" y="1098" fill="#8A92A6" font-size="17">Blank conversations older than this are archived and cleaned up when the plugin starts. 0 keeps them.</text>
  <rect x="1170" y="1056" width="76" height="38" rx="8" fill="#FBFCFE" stroke="#DDE1EA"/>
  <text x="1208" y="1082" fill="#1E2637" font-size="18" text-anchor="middle">24</text>
  <text x="1300" y="1082" fill="#7B8291" font-size="17">hours</text>

  <!-- card: manager -->
  <rect x="220" y="1140" width="1160" height="650" rx="18" fill="#FFFFFF" stroke="#E8EAF0" filter="url(#card)"/>
  <text x="256" y="1194" fill="#171A21" font-size="28" font-weight="650">Scratch conversations</text>
  <text x="256" y="1224" fill="#8A92A6" font-size="17">6 total · ≈ 184 MB · 1 new · missing: 1</text>
