<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1888" viewBox="0 0 1600 1888" fill="none" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
