  <rect x="268" y="1311" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#C8CDD8"/>
  <text x="296" y="1323" fill="#8A92A6" font-size="15">Select all</text>

  <text x="256" y="1360" fill="#8A92A6" font-size="15" font-weight="600">Today</text>

  <!-- row 1 -->
  <rect x="256" y="1372" width="1088" height="52" rx="8" fill="#F7F8FC"/>
  <rect x="268" y="1391" width="14" height="14" rx="3" fill="#4D6BFE"/>
  <path d="m271 1398 3 3 5-6" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
