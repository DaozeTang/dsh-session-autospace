  <text x="902" y="1405" fill="#7B8291" font-size="16" text-anchor="end">42.8 MB</text>
  <text x="1030" y="1405" fill="#7B8291" font-size="16" text-anchor="end">just now</text>
  <rect x="1052" y="1385" width="68" height="26" rx="13" fill="#E8F7F0"/>
  <text x="1086" y="1403" fill="#1F9D6B" font-size="13" text-anchor="middle" font-weight="600">Active</text>
  <g color="#8A92A6"><use href="#i-more" x="1308" y="1390" width="20" height="20"/></g>

  <!-- row 2 -->
  <rect x="268" y="1443" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#C8CDD8"/>
