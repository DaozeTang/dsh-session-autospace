  <text x="324" y="1457" fill="#1E2637" font-size="19">Untitled</text>
  <text x="704" y="1457" fill="#9AA1B0" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">…2a91f0b3</text>
  <text x="902" y="1457" fill="#7B8291" font-size="16" text-anchor="end">0 B</text>
  <text x="1030" y="1457" fill="#7B8291" font-size="16" text-anchor="end">3 h ago</text>
  <rect x="1060" y="1437" width="52" height="26" rx="13" fill="#F1F3F9"/>
  <text x="1086" y="1455" fill="#6A7181" font-size="13" text-anchor="middle" font-weight="600">New</text>
  <g color="#8A92A6"><use href="#i-more" x="1308" y="1442" width="20" height="20"/></g>

  <text x="256" y="1512" fill="#8A92A6" font-size="15" font-weight="600">Yesterday</text>

  <!-- row 3 -->
  <rect x="268" y="1525" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#C8CDD8"/>
  <g color="#6A7181"><use href="#i-folder" x="292" y="1518" width="22" height="22"/></g>
  <text x="324" y="1539" fill="#1E2637" font-size="19">Release notes draft</text>
  <text x="704" y="1539" fill="#9AA1B0" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">…77bde41c</text>
  <text x="902" y="1539" fill="#7B8291" font-size="16" text-anchor="end">12.4 MB</text>
  <text x="1030" y="1539" fill="#7B8291" font-size="16" text-anchor="end">1 d ago</text>
  <rect x="1044" y="1519" width="76" height="26" rx="13" fill="#F1F3F9"/>
  <text x="1082" y="1537" fill="#6A7181" font-size="13" text-anchor="middle" font-weight="600">Archived</text>
  <g color="#8A92A6"><use href="#i-more" x="1308" y="1524" width="20" height="20"/></g>

  <!-- row 4 -->
  <rect x="268" y="1577" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#C8CDD8"/>
  <g color="#C58A2A"><use href="#i-folder" x="292" y="1570" width="22" height="22"/></g>
  <text x="324" y="1591" fill="#1E2637" font-size="19">Kernel notes</text>
  <text x="704" y="1591" fill="#9AA1B0" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">…c04e19aa</text>
  <text x="902" y="1591" fill="#7B8291" font-size="16" text-anchor="end">—</text>
  <text x="1030" y="1591" fill="#7B8291" font-size="16" text-anchor="end">2 d ago</text>
  <rect x="1048" y="1571" width="100" height="26" rx="13" fill="#FDF3E2"/>
  <text x="1098" y="1589" fill="#B7791F" font-size="13" text-anchor="middle" font-weight="600">Folder missing</text>
  <g color="#8A92A6"><use href="#i-more" x="1308" y="1576" width="20" height="20"/></g>

  <!-- bulk bar -->
  <rect x="256" y="1624" width="1088" height="50" rx="9" fill="#F5F7FF" stroke="#D9E0FF"/>
  <text x="276" y="1655" fill="#1E2637" font-size="16">2 selected</text>
  <rect x="820" y="1634" width="92" height="30" rx="7" fill="#FFFFFF" stroke="#DDE1EA"/>
  <text x="866" y="1654" fill="#2A3040" font-size="14" text-anchor="middle">Archive</text>
  <rect x="920" y="1634" width="106" height="30" rx="7" fill="#FFFFFF" stroke="#DDE1EA"/>
  <text x="973" y="1654" fill="#2A3040" font-size="14" text-anchor="middle">Unarchive</text>
  <rect x="1034" y="1634" width="132" height="30" rx="7" fill="#FDECEC" stroke="#F3C9C9"/>
  <text x="1100" y="1654" fill="#C2463D" font-size="14" text-anchor="middle">Move to Trash</text>
  <rect x="1174" y="1634" width="150" height="30" rx="7" fill="#FFFFFF" stroke="#DDE1EA"/>
  <text x="1249" y="1654" fill="#2A3040" font-size="14" text-anchor="middle">Clear selection</text>

  <!-- maintenance -->
  <text x="256" y="1710" fill="#171A21" font-size="20" font-weight="650">Maintenance</text>
  <rect x="256" y="1726" width="226" height="36" rx="8" fill="#FFFFFF" stroke="#DDE1EA"/>
  <text x="274" y="1750" fill="#2A3040" font-size="16">Reclaim new conversations</text>
  <text x="452" y="1750" fill="#9AA1B0" font-size="15">(1)</text>
  <rect x="494" y="1726" width="196" height="36" rx="8" fill="#FFFFFF" stroke="#DDE1EA"/>
  <text x="512" y="1750" fill="#2A3040" font-size="16">Clean orphan folders</text>
  <text x="670" y="1750" fill="#9AA1B0" font-size="15">(0)</text>
  <rect x="702" y="1726" width="226" height="36" rx="8" fill="#FFFFFF" stroke="#DDE1EA"/>
  <text x="720" y="1750" fill="#2A3040" font-size="16">Rebuild missing folders</text>
  <text x="898" y="1750" fill="#9AA1B0" font-size="15">(1)</text>

  <!-- footer -->
  <text x="220" y="1840" fill="#9AA1B0" font-size="16">While a conversation is staged, the sidebar shows a temporary “No workspace” group beside any Ungrouped group it already has.</text>
  <text x="220" y="1866" fill="#9AA1B0" font-size="16">Deleting means archive + move the folder to the system Trash. Disabling the plugin restores the stock DSH surfaces and keeps every conversation.</text>
</svg>