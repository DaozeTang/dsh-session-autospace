<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F9FC"/><stop offset="1" stop-color="#EEF1F8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 820) rotate(-35) scale(600)">
      <stop stop-color="#4D6BFE" stop-opacity=".10"/><stop offset="1" stop-color="#4D6BFE" stop-opacity="0"/>
    </radialGradient>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#1B2340" flood-opacity=".10"/>
    </filter>
    <filter id="menuShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1B2340" flood-opacity=".18"/>
    </filter>
    <filter id="chipShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1B2340" flood-opacity=".08"/>
    </filter>
    <symbol id="i-folder" viewBox="0 0 24 24">
      <path d="M3.5 7.2c0-.9.7-1.6 1.6-1.6h3.6c.4 0 .8.2 1.1.5l1.3 1.3h7.9c.9 0 1.6.7 1.6 1.6v8.4c0 .9-.7 1.6-1.6 1.6H5.1c-.9 0-1.6-.7-1.6-1.6V7.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5.5v13M5.5 12h13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="m5.5 12.5 4.2 4.2 8.8-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-spark" viewBox="0 0 24 24">
      <path d="M4.5 12.5c0-.6.4-1 1-1h3.1l1.2-1.2c.2-.2.4-.3.7-.3h3.9c.6 0 1 .4 1 1v2.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="4.5" y="9.4" width="15" height="8.2" rx="2.2" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="9.4" cy="13.5" r=".9" fill="currentColor"/><circle cx="12" cy="13.5" r=".9" fill="currentColor"/><circle cx="14.6" cy="13.5" r=".9" fill="currentColor"/>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24">
      <path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24">
      <path d="M5 12 20 4l-4 16-5.5-6.5L5 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="m10.5 13.5 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <rect x="70" y="80" width="980" height="740" rx="26" fill="#FFFFFF" filter="url(#panelShadow)"/>
  <text x="112" y="136" fill="#8A92A6" font-size="22" font-weight="600" letter-spacing="1">NEW CONVERSATION</text>
  <text x="1010" y="136" fill="#A0A7B5" font-size="20" text-anchor="end">DSH · web</text>

  <text x="112" y="214" fill="#6A7181" font-size="20">Workspace</text>
  <rect x="112" y="232" width="300" height="56" rx="12" fill="#FFFFFF" stroke="#4D6BFE" stroke-width="2" filter="url(#chipShadow)"/>
  <g color="#4D6BFE"><use href="#i-spark" x="132" y="248" width="24" height="24"/></g>
  <text x="168" y="268" fill="#1E2637" font-size="22" font-weight="600">No workspace</text>
  <path d="m372 255 7 7 7-7" stroke="#4D6BFE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="112" y="312" width="560" height="400" rx="18" fill="#FFFFFF" stroke="#E5E7EE" filter="url(#menuShadow)"/>
  <text x="136" y="350" fill="#8A92A6" font-size="19">Workspaces</text>

  <g color="#6E7688"><use href="#i-folder" x="136" y="374" width="24" height="24"/></g>
  <text x="174" y="393" fill="#2A3040" font-size="23">Design system</text>
  <g color="#6E7688"><use href="#i-folder" x="136" y="430" width="24" height="24"/></g>
  <text x="174" y="449" fill="#2A3040" font-size="23">API playground</text>
  <g color="#6E7688"><use href="#i-folder" x="136" y="486" width="24" height="24"/></g>
  <text x="174" y="505" fill="#2A3040" font-size="23">Docs site</text>

  <path d="M128 556h528" stroke="#E7E9F0" stroke-width="2"/>
  <g color="#6E7688"><use href="#i-plus" x="136" y="584" width="24" height="24"/></g>
  <text x="174" y="603" fill="#2A3040" font-size="23">Add workspace…</text>

  <rect x="120" y="628" width="544" height="64" rx="10" fill="#EDF0FF"/>
  <g color="#4D6BFE"><use href="#i-spark" x="138" y="648" width="26" height="26"/></g>
  <text x="178" y="670" fill="#1E2637" font-size="23" font-weight="600">No workspace</text>
  <text x="540" y="664" fill="#5D6B96" font-size="18" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/DSH</text>
  <g color="#4D6BFE"><use href="#i-check" x="612" y="646" width="28" height="28"/></g>

  <rect x="112" y="752" width="896" height="44" rx="12" fill="#F7F8FB" stroke="#E8EAF0"/>
  <text x="136" y="780" fill="#A0A7B5" font-size="20">Ask anything…</text>
  <circle cx="972" cy="774" r="17" fill="#4D6BFE"/>
  <g color="#FFFFFF"><use href="#i-send" x="962" y="764" width="20" height="20"/></g>
  <text x="550" y="780" fill="#9AA1B0" font-size="18" text-anchor="middle">native input · native send</text>

  <path d="M700 660 C780 660 800 660 836 660" stroke="#4D6BFE" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="2 8"/>
  <path d="m826 652 12 8-12 8" stroke="#4D6BFE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="1110" y="188" fill="#171A21" font-size="44" font-weight="700" letter-spacing="-1">One extra entry.</text>
  <text x="1110" y="234" fill="#646A77" font-size="24">Everything else is the workspace menu</text>
  <text x="1110" y="266" fill="#646A77" font-size="24">you already know.</text>

  <circle cx="1128" cy="326" r="15" fill="#E9EDFF"/>
  <text x="1128" y="333" fill="#4D6BFE" font-size="17" font-weight="700" text-anchor="middle">1</text>
  <text x="1160" y="319" fill="#1C1D21" font-size="24" font-weight="650">No new window</text>
  <text x="1160" y="349" fill="#7B8291" font-size="20">The conversation opens in place.</text>

  <circle cx="1128" cy="412" r="15" fill="#E9EDFF"/>
  <text x="1128" y="419" fill="#4D6BFE" font-size="17" font-weight="700" text-anchor="middle">2</text>
  <text x="1160" y="405" fill="#1C1D21" font-size="24" font-weight="650">A real folder</text>
  <text x="1160" y="435" fill="#7B8291" font-size="20">~/DSH/session-&lt;id&gt;, mode 0700.</text>

  <circle cx="1128" cy="498" r="15" fill="#E9EDFF"/>
  <text x="1128" y="505" fill="#4D6BFE" font-size="17" font-weight="700" text-anchor="middle">3</text>
  <text x="1160" y="491" fill="#1C1D21" font-size="24" font-weight="650">A real boundary</text>
  <text x="1160" y="521" fill="#7B8291" font-size="20">workspace-write stops at that folder.</text>

  <rect x="1110" y="596" width="404" height="138" rx="16" fill="#FFFFFF" stroke="#E5E7EE"/>
  <text x="1134" y="632" fill="#8A92A6" font-size="17" font-weight="700" letter-spacing="1">AFTER THE FIRST MESSAGE</text>
  <text x="1134" y="670" fill="#2A3040" font-size="22">The temporary group leaves.</text>
  <text x="1134" y="702" fill="#2A3040" font-size="22">The conversation stays.</text>
  <text x="1134" y="728" fill="#7B8291" font-size="18">Folder, cwd, sandbox: unchanged.</text>

  <text x="1110" y="790" fill="#9AA1B0" font-size="17">Illustration · synthetic data</text>
</svg>