<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" fill="none" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F9FC"/><stop offset="1" stop-color="#EEF1F8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1330 120) rotate(140) scale(520)">
      <stop stop-color="#4D6BFE" stop-opacity=".13"/><stop offset="1" stop-color="#4D6BFE" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1B2340" flood-opacity=".10"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1B2340" flood-opacity=".08"/>
    </filter>
    <symbol id="i-folder" viewBox="0 0 24 24">
      <path d="M3.5 7.2c0-.9.7-1.6 1.6-1.6h3.6c.4 0 .8.2 1.1.5l1.3 1.3h7.9c.9 0 1.6.7 1.6 1.6v8.4c0 .9-.7 1.6-1.6 1.6H5.1c-.9 0-1.6-.7-1.6-1.6V7.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-spark" viewBox="0 0 24 24">
      <path d="M4.5 12.5c0-.6.4-1 1-1h3.1l1.2-1.2c.2-.2.4-.3.7-.3h3.9c.6 0 1 .4 1 1v2.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="4.5" y="9.4" width="15" height="8.2" rx="2.2" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="9.4" cy="13.5" r=".9" fill="currentColor"/><circle cx="12" cy="13.5" r=".9" fill="currentColor"/><circle cx="14.6" cy="13.5" r=".9" fill="currentColor"/>
    </symbol>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#glow)"/>

  <text x="100" y="104" fill="#4D6BFE" font-size="22" font-weight="700" letter-spacing="4">DSH PLUGIN</text>
  <text x="100" y="182" fill="#171A21" font-size="56" font-weight="700" letter-spacing="-1.2">One conversation, one folder,</text>
  <text x="100" y="250" fill="#171A21" font-size="56" font-weight="700" letter-spacing="-1.2">its own sandbox.</text>
  <text x="100" y="310" fill="#646A77" font-size="27">“No workspace” is now a first-class way to start a conversation.</text>

  <rect x="100" y="356" width="700" height="366" rx="24" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <g color="#4D6BFE"><use href="#i-folder" x="132" y="388" width="30" height="30"/></g>
  <text x="176" y="412" fill="#171A21" font-size="26" font-weight="650">Working path</text>
  <rect x="640" y="382" width="124" height="38" rx="10" fill="#F1F3F9"/>
  <text x="702" y="408" fill="#3F4655" font-size="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/DSH</text>

  <rect x="132" y="438" width="636" height="248" rx="18" stroke="#B9C2D6" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="154" y="460" width="592" height="66" rx="14" fill="#F5F7FF" stroke="#4D6BFE" stroke-width="2" filter="url(#softShadow)"/>
  <g color="#4D6BFE"><use href="#i-folder" x="174" y="477" width="32" height="32"/></g>
  <text x="222" y="503" fill="#171A21" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">session-8f6c…</text>
  <rect x="540" y="478" width="184" height="30" rx="15" fill="#4D6BFE"/>
  <text x="632" y="499" fill="#FFFFFF" font-size="18" text-anchor="middle" font-weight="600">cwd + sandbox</text>

  <g color="#8A92A6"><use href="#i-folder" x="174" y="551" width="32" height="32"/></g>
  <text x="222" y="577" fill="#596172" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">session-2a91…</text>
  <text x="714" y="577" fill="#9AA1B0" font-size="19" text-anchor="end">0700</text>

  <g color="#8A92A6"><use href="#i-folder" x="174" y="625" width="32" height="32"/></g>
  <text x="222" y="651" fill="#596172" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">session-77bd…</text>
  <text x="714" y="651" fill="#9AA1B0" font-size="19" text-anchor="end">0700</text>

  <path d="M818 540 C846 540 852 540 876 540" stroke="#4D6BFE" stroke-width="2.5" stroke-linecap="round"/>
  <path d="m866 530 12 10-12 10" stroke="#4D6BFE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="858" y="510" fill="#4D6BFE" font-size="17" text-anchor="middle" font-weight="600">send</text>

  <rect x="900" y="356" width="600" height="366" rx="24" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="936" y="404" fill="#8A92A6" font-size="21" font-weight="600" letter-spacing="1">SIDEBAR</text>
  <text x="936" y="446" fill="#8A92A6" font-size="18">Workspaces</text>
  <g color="#8A92A6"><use href="#i-folder" x="936" y="462" width="24" height="24"/></g>
  <text x="972" y="481" fill="#3F4655" font-size="22">Design system</text>
  <g color="#8A92A6"><use href="#i-folder" x="936" y="500" width="24" height="24"/></g>
  <text x="972" y="519" fill="#3F4655" font-size="22">API playground</text>
  <text x="936" y="558" fill="#8A92A6" font-size="18">Ungrouped</text>

  <rect x="918" y="572" width="564" height="58" rx="12" fill="#EDF0FF"/>
  <rect x="918" y="572" width="4" height="58" rx="2" fill="#4D6BFE"/>
  <g color="#4D6BFE"><use href="#i-spark" x="940" y="588" width="26" height="26"/></g>
  <text x="980" y="607" fill="#1E2637" font-size="22" font-weight="600">How the sandbox works</text>
  <text x="1302" y="607" fill="#4D6BFE" font-size="17" text-anchor="end" font-weight="600">settled</text>

  <text x="980" y="662" fill="#596172" font-size="21">Regex notes</text>
  <text x="980" y="696" fill="#596172" font-size="21">Release notes draft</text>

  <text x="100" y="768" fill="#7B8291" font-size="21">Each folder becomes that conversation’s working directory and its <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">workspace-write</tspan> boundary. Nothing is shared.</text>
</svg>